lang: en
title: Stephen Chen
short_title: Stephen
description: Personal site for writing, experiments, and selected work.
tagline: Thoughtful web work, notes in progress, and the projects worth keeping.
url: "https://siyche.github.io"
baseurl: ""
timezone: America/Denver
author:
  name: Stephen Chen
  about: >
    I use this site to collect writing, experiments, and the work I want to
    stay visible after the launch rush fades.
  social:
    email: stiyche23@hotmail.com
    github: siyche
    linkedin: siyche

accent_image: /assets/img/sidebar-chatgpt-water.png
accent_color: rgb(92,224,219)
theme_color: rgb(6,15,24)

menu:
  - title: Experience
    url: /experience/
  - title: Projects
    url: /showcase/
  - title: Photography
    url: /experience/bluesky/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

permalink: pretty
markdown: kramdown

plugins:
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

hydejack:
  no_search: true
  no_drawer: true
  no_push_state: true
  no_navbar: true
  no_breadcrumbs: true
  no_break_layout: true
  cookies_banner: false
  advertise: false
  hide_dates: false
  hide_last_modified: false

  dark_mode:
    always: true
    dynamic: false
    sunrise: 6
    sunset: 18
    icon: false

sass:
  style: compressed
